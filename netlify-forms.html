<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>forms</title></head>
<body>
<!-- Netlify detects the form fields from this static copy; the real form is rendered by the page script. -->
<form name="mayoreo" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="name"><input name="company"><input name="email"><input name="phone">
  <select name="category"><option></option></select><input name="volume"><textarea name="message"></textarea>
  <input name="pagina"><input name="bot-field">
</form>
</body></html>
